name: Offline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: newsagent2-offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-python312.txt
      - name: Install checked dependencies
        run: bash tools/install_dependencies.sh dev
      - name: Install checksum-verified actionlint
        run: bash tools/install_actionlint.sh "$RUNNER_TEMP/actionlint"
      - name: Import and syntax checks
        run: |
          python -m compileall -q src tests tools
          python -c 'from newsagent2 import main, emailer, delivery, pre_smtp_recovery, run_context'
      - name: Validate configuration and workflows
        run: |
          python tools/verify_configs.py
          # Optional host-provided linters must not change validation by runner.
          # Existing production shell lint is outside this dependency-only edit.
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck="" -pyflakes=""
          bash -n tools/install_dependencies.sh tools/install_actionlint.sh
      - name: Run isolated offline suite
        run: python -m pytest -q --junitxml=.ci-results/pytest.xml
      - name: Upload test results and integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-ci-results
          path: .ci-results/
          if-no-files-found: warn
