# Dedicated Cybermed pipeline.  It intentionally has no YouTube/Deno steps and
# no Cyberlurch report invocation, so either newsletter can fail independently.
name: NewsAgent2 Cybermed

on:
  schedule:
    # Native local slot; GitHub still provides no punctuality guarantee.
    - cron: "40 5 * * *"
      timezone: Europe/Stockholm
  workflow_dispatch:
    inputs:
      logical_date:
        description: "Optional explicit edition date (YYYY-MM-DD); no automatic historical replay"
        required: false
        type: string
      report_mode:
        description: "Cybermed cadence"
        default: daily
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly
          - yearly
      lookback_hours:
        description: "Override lookback window in hours (blank = cadence default)"
        required: false
        type: string
      year_in_review_year:
        description: "Optional target year for Year in Review"
        required: false
        type: string
      rollup_month_override:
        description: "Optional Monthly target month (YYYY-MM)"
        required: false
        type: string
      email_mode:
        description: "Email behavior for manual runs"
        default: none
        type: choice
        options:
          - none
          - test
          - real

concurrency:
  group: newsagent2-state-writers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  run-cybermed:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DELIVERY_RECIPIENT_HMAC_KEY: ${{ secrets.DELIVERY_RECIPIENT_HMAC_KEY }}
      DELIVERY_RECOVERY_ACK_RUN_IDS: ${{ vars.DELIVERY_RECOVERY_ACK_RUN_IDS || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_MODEL_PUBMED_DEEPDIVE: ${{ vars.OPENAI_MODEL_PUBMED_DEEPDIVE || 'gpt-4.1' }}
      OPENAI_MODEL_PUBMED_DEEPDIVE_FALLBACK: ${{ vars.OPENAI_MODEL_PUBMED_DEEPDIVE_FALLBACK || '' }}
      OPENAI_MODEL_CYBERMED: ${{ vars.OPENAI_MODEL_CYBERMED || 'gpt-4.1-2025-04-14' }}
      OPENAI_MODEL_CYBERMED_OVERVIEW: ${{ vars.OPENAI_MODEL_CYBERMED_OVERVIEW || vars.OPENAI_MODEL_CYBERMED || 'gpt-4.1-2025-04-14' }}
      OPENAI_MODEL_CYBERMED_DEEPDIVE: ${{ vars.OPENAI_MODEL_CYBERMED_DEEPDIVE || vars.OPENAI_MODEL_CYBERMED || 'gpt-4.1-2025-04-14' }}
      OPENAI_MODEL_CYBERMED_DEEPDIVE_FALLBACK: ${{ vars.OPENAI_MODEL_CYBERMED_DEEPDIVE_FALLBACK || '' }}
      OPENAI_MODEL_CYBERMED_BOTTOM_LINE: ${{ vars.OPENAI_MODEL_CYBERMED_BOTTOM_LINE || vars.OPENAI_MODEL_CYBERMED || 'gpt-4.1-2025-04-14' }}
      CYBERMED_OPENAI_MAX_CALLS_PER_RUN: ${{ vars.CYBERMED_OPENAI_MAX_CALLS_PER_RUN || '96' }}
      CYBERMED_OPENAI_MAX_INPUT_TOKENS_PER_RUN: ${{ vars.CYBERMED_OPENAI_MAX_INPUT_TOKENS_PER_RUN || '350000' }}
      CYBERMED_OPENAI_MAX_OUTPUT_TOKENS_PER_RUN: ${{ vars.CYBERMED_OPENAI_MAX_OUTPUT_TOKENS_PER_RUN || '80000' }}
      CYBERMED_OPENAI_MAX_ESTIMATED_COST_USD_PER_RUN: ${{ vars.CYBERMED_OPENAI_MAX_ESTIMATED_COST_USD_PER_RUN || '1.50' }}
      CYBERMED_MODEL_EVAL_MODE: "0"
      PYTHONUNBUFFERED: "1"

      SEND_EMAIL: ${{ github.event_name == 'workflow_dispatch' && (inputs.email_mode || 'none') == 'none' && '0' || (vars.SEND_EMAIL || '1') }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM || '' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_TOOL: ${{ vars.NCBI_TOOL || 'NewsAgent2' }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL || '' }}
      UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL || vars.NCBI_EMAIL || '' }}
      PUBMED_MIN_INTERVAL_S: ${{ vars.PUBMED_MIN_INTERVAL_S || '0.40' }}
      PUBMED_MAX_RETRIES: ${{ vars.PUBMED_MAX_RETRIES || '4' }}
      PUBMED_BACKOFF_BASE_S: ${{ vars.PUBMED_BACKOFF_BASE_S || '1.0' }}
      PUBMED_DATE_TYPE: ${{ vars.PUBMED_DATE_TYPE || 'pdat' }}
      PUBMED_DEEPDIVE_USE_PMC_OA_FULLTEXT: ${{ vars.PUBMED_DEEPDIVE_USE_PMC_OA_FULLTEXT || 'true' }}
      PUBMED_DEEPDIVE_USE_UNPAYWALL_FULLTEXT: ${{ vars.PUBMED_DEEPDIVE_USE_UNPAYWALL_FULLTEXT || 'true' }}
      CYBERMED_MAX_ITEMS_PER_CHANNEL: ${{ vars.CYBERMED_MAX_ITEMS_PER_CHANNEL || '25' }}

      FOAMED_AUDIT: ${{ vars.FOAMED_AUDIT || '0' }}
      FOAMED_AUDIT_CHECK_DISABLED: ${{ vars.FOAMED_AUDIT_CHECK_DISABLED || '0' }}
      FOAMED_ARTICLE_FETCH: ${{ vars.FOAMED_ARTICLE_FETCH || '0' }}
      FOAMED_ARTICLE_FETCH_MAX_PER_RUN: ${{ vars.FOAMED_ARTICLE_FETCH_MAX_PER_RUN || '25' }}
      FOAMED_RENDER_FALLBACK: ${{ vars.FOAMED_RENDER_FALLBACK || '0' }}
      FOAMED_ROLLING_AUDIT_DAYS: ${{ vars.FOAMED_ROLLING_AUDIT_DAYS || '0' }}
      FOAMED_ROLLING_AUDIT_FETCH_MAX_PER_RUN: ${{ vars.FOAMED_ROLLING_AUDIT_FETCH_MAX_PER_RUN || '60' }}

      NEWSAGENT_PLAN_PATH: out/cybermed_plan_metadata.json
      NEWSAGENT_REQUESTED_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.logical_date || '' }}
      NEWSAGENT_TRIGGER_SCHEDULE: ${{ github.event.schedule || '' }}
      REPORT_DIR: out
      # Recovery and publication run in separate shells from report generation.
      REPORT_KEY: cybermed
      REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.report_mode || 'daily') || 'daily' }}
      LOOKBACK_HOURS_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_hours || '' }}
      EMAIL_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.email_mode || 'none') || 'real' }}
      CYBERMED_QA_REPLAY_MODE: "0"
      CYBERMED_DIGEST_STORE_OVERWRITE: "0"
      CYBERMED_DIGEST_BACKFILL_MODE: "0"
      CYBERMED_DIGEST_BACKFILL_OVERWRITE_EMPTY_ONLY: "1"
      CYBERMED_WEEKLY_QA_FIXTURE_MODE: "0"
      CYBERMED_MONTHLY_QA_FIXTURE_MODE: "0"
      CYBERMED_HEAVY_AUDIT_MODE: ${{ vars.CYBERMED_HEAVY_AUDIT_MODE || '0' }}

    steps:
      - name: Capture observed job start
        run: echo "NEWSAGENT_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: "NewsAgent2 recovery v1 / cybermed / ${{ env.EMAIL_MODE }}"
        run: |
          case "$EMAIL_MODE" in
            none|test|real) echo "Recovery mode validated." ;;
            *) exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bash tools/install_dependencies.sh runtime

      - name: Compute frozen cybermed run plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROLLUP_MONTH_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.rollup_month_override || '' }}
          YEAR_IN_REVIEW_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.year_in_review_year || '' }}
        run: |
          set -euo pipefail
          python -m src.newsagent2.edition_plan --report-key cybermed

      - name: Prepare output directory
        if: steps.plan.outputs.skip != 'true'
        run: |
          mkdir -p out

      - name: Recover prior cybermed receipts before any sender
        if: steps.plan.outputs.skip != 'true' && (github.event_name == 'schedule' || env.EMAIL_MODE == 'real')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.newsagent2.workflow_delivery recover --report-key cybermed --workflow cybermed.yml

      - name: Run Cybermed reports
        if: steps.plan.outputs.skip != 'true'
        env:
          RUN_MODES: ${{ steps.plan.outputs.modes }}
          RUN_LOG_PATH: out/cybermed-run.log
          RECIPIENTS_JSON_CYBERMED: ${{ (github.event_name != 'workflow_dispatch' || (inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERMED || '' }}
          RECIPIENTS_JSON_CYBERMED_DAILY: ${{ (github.event_name != 'workflow_dispatch' || (inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERMED_DAILY || '' }}
          RECIPIENTS_JSON_CYBERMED_WEEKLY: ${{ (github.event_name != 'workflow_dispatch' || (inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERMED_WEEKLY || '' }}
          RECIPIENTS_JSON_CYBERMED_MONTHLY: ${{ (github.event_name != 'workflow_dispatch' || (inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERMED_MONTHLY || '' }}
          RECIPIENTS_CONFIG_JSON: ${{ (github.event_name != 'workflow_dispatch' || (inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_CONFIG_JSON || '' }}
          TEST_RECIPIENTS_CONFIG_JSON: ${{ github.event_name == 'workflow_dispatch' && (inputs.email_mode || 'none') == 'test' && secrets.TEST_RECIPIENTS_CONFIG_JSON || '' }}
          YEAR_IN_REVIEW_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.year_in_review_year || '' }}
          ROLLUP_MONTH_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.rollup_month_override || '' }}
        run: |
          set -euo pipefail
          : > "$RUN_LOG_PATH"
          exec > >(tee -a "$RUN_LOG_PATH") 2>&1

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${EMAIL_MODE:-none}" in
              none)
                export SEND_EMAIL=0
                unset RECIPIENTS_CONFIG_JSON
                unset RECIPIENTS_JSON_CYBERMED RECIPIENTS_JSON_CYBERMED_DAILY RECIPIENTS_JSON_CYBERMED_WEEKLY RECIPIENTS_JSON_CYBERMED_MONTHLY
                ;;
              test)
                export SEND_EMAIL=1
                unset RECIPIENTS_JSON_CYBERMED RECIPIENTS_JSON_CYBERMED_DAILY RECIPIENTS_JSON_CYBERMED_WEEKLY RECIPIENTS_JSON_CYBERMED_MONTHLY
                export RECIPIENTS_CONFIG_JSON="${TEST_RECIPIENTS_CONFIG_JSON:-}"
                ;;
              real)
                export SEND_EMAIL="${SEND_EMAIL:-1}"
                ;;
              *)
                echo "ERROR: unsupported email_mode"
                exit 1
                ;;
            esac
          fi

          for mode in $RUN_MODES; do
            export REPORT_MODE="$mode"
            if [ "$mode" = "daily" ] && [ "${CYBERMED_HEAVY_AUDIT_MODE:-0}" != "1" ]; then
              # Audits are maintenance diagnostics, not part of the delivery path.
              export FOAMED_AUDIT=0
              export FOAMED_AUDIT_CHECK_DISABLED=0
              export FOAMED_ROLLING_AUDIT_DAYS=0
              export FOAMED_ARTICLE_FETCH_MAX_PER_RUN=8
              export FOAMED_COLLECTION_BUDGET_SECONDS=420
              echo "[foamed-runtime] daily bounded mode: audit=0 disabled_audit=0 rolling_audit_days=0 article_fetch_max=8 collection_budget_seconds=420"
            fi
            REPORT_KEY=cybermed \
            REPORT_TITLE="Cybermed Report" \
            REPORT_SUBJECT="Cybermed Report" \
            REPORT_LANGUAGE=en \
            REPORT_PROFILE=medical \
            SEND_EMPTY_REPORT_EMAIL="1" \
            python -u -m src.newsagent2.main --channels data/cybermed_channels.json --hours 24
          done

      - name: Verify each planned cybermed delivery result
        if: always() && steps.plan.outputs.skip != 'true'
        env:
          RUN_MODES: ${{ steps.plan.outputs.modes }}
        run: |
          set -euo pipefail
          python -m src.newsagent2.workflow_delivery verify --report-key cybermed --modes $RUN_MODES

      - name: Preserve failure before plan creation
        if: always()
        run: |
          if [ ! -f "$NEWSAGENT_PLAN_PATH" ]; then
            python -c 'from src.newsagent2.run_timing import write_plan_failure; write_plan_failure("cybermed", "workflow_failed_before_plan")'
          fi

      - name: Upload cybermed report and recovery artifacts
        if: always() && steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cybermed-reports-${{ github.run_id }}
          path: |
            out/*.md
            out/*diagnostics*.json
            out/*metadata*.json
            out/*metadata*.md
            out/*delivery_result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and publish validated cybermed state
        if: success() && steps.plan.outputs.skip != 'true' && (github.event_name == 'schedule' || env.EMAIL_MODE == 'real')
        run: |
          set -euo pipefail
          git config user.name "newsagent-bot"
          git config user.email "newsagent-bot@users.noreply.github.com"
          python -m src.newsagent2.workflow_delivery publish --paths state/processed_items.json state/rollups.json state/delivery_journal.json state/cybermed_daily_digests.json state/cybermed_weekly_digests.json state/cybermed_pubmed_ingestion.json

      - name: Upload cybermed delivery recovery
        if: always() && steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cybermed-delivery-recovery-${{ github.run_id }}
          path: out/recovery/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload cybermed plan and observed timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cybermed-run-metadata-${{ github.run_id }}
          path: |
            out/*plan_metadata.json
            out/*plan_failure_metadata.json
            out/*timing_metadata.json
          if-no-files-found: warn
          retention-days: 30
