# .github/workflows/newsagent.yml
name: NewsAgent2 daily

on:
  schedule:
    # Native local slot; GitHub still provides no punctuality guarantee.
    - cron: "30 5 * * *"
      timezone: Europe/Stockholm
  workflow_dispatch:
    inputs:
      logical_date:
        description: "Optional explicit edition date (YYYY-MM-DD); no automatic historical replay"
        required: false
        type: string
      report_mode:
        description: "Report cadence"
        default: daily
        type: choice
        options:
          - all
          - daily
          - weekly
          - monthly
          - yearly
      lookback_hours:
        description: "Override lookback window in hours (blank = default per mode)"
        required: false
        type: string
      year_in_review_year:
        description: "Optional target year for yearly runs (e.g., 2025)"
        required: false
        type: string
      rollup_month_override:
        description: "Optional Monthly target month (YYYY-MM)"
        required: false
        type: string
      persist_monthly_rollup:
        description: "Persist a no-email Cyberlurch Monthly backfill rollup"
        required: false
        default: false
        type: boolean
      which_report:
        description: "Report target (Cybermed has a dedicated workflow)"
        default: cyberlurch
        type: choice
        options:
          - cyberlurch
      email_mode:
        description: "Email behavior for manual runs"
        default: none
        type: choice
        options:
          - none
          - test
          - real
      cyberlurch_channels_file:
        description: "Cyberlurch channels file override"
        required: false
        default: ""
        type: string
      managed_transcript_provider:
        description: "Managed transcript provider override"
        required: false
        default: default
        type: choice
        options:
          - default
          - none
          - transcriptapi
          - supadata
          - generic

concurrency:
  group: newsagent2-state-writers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04

    # IMPORTANT (log safety):
    # - Do NOT pass recipient email addresses via env/vars (they can leak in logs).
    # - Recipients must be passed only as JSON via GitHub Secrets.
    env:
      DELIVERY_RECIPIENT_HMAC_KEY: ${{ secrets.DELIVERY_RECIPIENT_HMAC_KEY }}
      DELIVERY_RECOVERY_ACK_RUN_IDS: ${{ vars.DELIVERY_RECOVERY_ACK_RUN_IDS || '' }}
      # OpenAI
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_MODEL_CYBERLURCH_CHUNKS: ${{ vars.OPENAI_MODEL_CYBERLURCH_CHUNKS || vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_MODEL_CYBERLURCH_OVERVIEW: ${{ vars.OPENAI_MODEL_CYBERLURCH_OVERVIEW || vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_MODEL_CYBERLURCH_DEEPDIVE: ${{ vars.OPENAI_MODEL_CYBERLURCH_DEEPDIVE || vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_MODEL_CYBERLURCH_DIRECT_DIGEST: ${{ vars.OPENAI_MODEL_CYBERLURCH_DIRECT_DIGEST || vars.OPENAI_MODEL_CYBERLURCH_CHUNKS || vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_MODEL_CYBERLURCH_DIRECT_DIGEST_FALLBACK: ${{ vars.OPENAI_MODEL_CYBERLURCH_DIRECT_DIGEST_FALLBACK || vars.OPENAI_MODEL_CYBERLURCH_OVERVIEW || vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_MODEL_PUBMED_DEEPDIVE: ${{ vars.OPENAI_MODEL_PUBMED_DEEPDIVE || 'gpt-4.1' }}
      OPENAI_MODEL_PUBMED_DEEPDIVE_FALLBACK: ${{ vars.OPENAI_MODEL_PUBMED_DEEPDIVE_FALLBACK || '' }}

      # E-Mail (SMTP)
      SEND_EMAIL: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.email_mode || 'none') == 'none' && '0' || (vars.SEND_EMAIL || '1') }}
      EMAIL_FROM: ${{ secrets.CYBERLURCH_EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.CYBERLURCH_SMTP_HOST }}
      SMTP_PORT: ${{ secrets.CYBERLURCH_SMTP_PORT }}
      SMTP_USER: ${{ secrets.CYBERLURCH_SMTP_USER }}
      SMTP_PASS: ${{ secrets.CYBERLURCH_SMTP_PASS }}

      # PubMed / NCBI (optional)
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      NCBI_TOOL: ${{ vars.NCBI_TOOL || 'NewsAgent2' }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL || '' }}
      UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL || vars.NCBI_EMAIL || '' }}

      # PubMed Rate-Limit robustness (non-secret)
      PUBMED_MIN_INTERVAL_S: ${{ vars.PUBMED_MIN_INTERVAL_S || '0.40' }}
      PUBMED_MAX_RETRIES: ${{ vars.PUBMED_MAX_RETRIES || '4' }}
      PUBMED_BACKOFF_BASE_S: ${{ vars.PUBMED_BACKOFF_BASE_S || '1.0' }}
      PUBMED_DATE_TYPE: ${{ vars.PUBMED_DATE_TYPE || 'pdat' }}
      PUBMED_DEEPDIVE_USE_PMC_OA_FULLTEXT: ${{ vars.PUBMED_DEEPDIVE_USE_PMC_OA_FULLTEXT || 'true' }}
      PUBMED_DEEPDIVE_USE_UNPAYWALL_FULLTEXT: ${{ vars.PUBMED_DEEPDIVE_USE_UNPAYWALL_FULLTEXT || 'true' }}
      CYBERMED_MAX_ITEMS_PER_CHANNEL: ${{ vars.CYBERMED_MAX_ITEMS_PER_CHANNEL || '25' }}
      FOAMED_AUDIT: ${{ vars.FOAMED_AUDIT || '0' }}
      FOAMED_AUDIT_CHECK_DISABLED: ${{ vars.FOAMED_AUDIT_CHECK_DISABLED || '0' }}
      FOAMED_ARTICLE_FETCH: ${{ vars.FOAMED_ARTICLE_FETCH || '0' }}
      FOAMED_ARTICLE_FETCH_MAX_PER_RUN: ${{ vars.FOAMED_ARTICLE_FETCH_MAX_PER_RUN || '25' }}
      FOAMED_RENDER_FALLBACK: ${{ vars.FOAMED_RENDER_FALLBACK || '0' }}
      FOAMED_ROLLING_AUDIT_DAYS: ${{ vars.FOAMED_ROLLING_AUDIT_DAYS || '0' }}
      FOAMED_ROLLING_AUDIT_FETCH_MAX_PER_RUN: ${{ vars.FOAMED_ROLLING_AUDIT_FETCH_MAX_PER_RUN || '60' }}
      CYBERMED_HEAVY_AUDIT_MODE: ${{ vars.CYBERMED_HEAVY_AUDIT_MODE || '0' }}
      NEWSAGENT_PLAN_PATH: out/cyberlurch_plan_metadata.json
      NEWSAGENT_REQUESTED_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.logical_date || '' }}
      NEWSAGENT_TRIGGER_SCHEDULE: ${{ github.event.schedule || '' }}
      REPORT_DIR: out
      # Keep this newsletter's identity in recovery and publication steps too.
      REPORT_KEY: cyberlurch
      REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.report_mode || 'daily') || 'daily' }}
      LOOKBACK_HOURS_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lookback_hours || '' }}
      ROLLUP_MONTH_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollup_month_override || '' }}
      WHICH_REPORT: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.which_report || 'cyberlurch') || 'both' }}
      EMAIL_MODE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.email_mode || 'none') || 'real' }}
      CYBERMED_QA_REPLAY_MODE: ${{ vars.CYBERMED_QA_REPLAY_MODE || '0' }}
      CYBERMED_DIGEST_STORE_OVERWRITE: ${{ vars.CYBERMED_DIGEST_STORE_OVERWRITE || '0' }}
      CYBERMED_DIGEST_BACKFILL_MODE: ${{ vars.CYBERMED_DIGEST_BACKFILL_MODE || '0' }}
      CYBERMED_DIGEST_BACKFILL_LOOKBACK_HOURS: ${{ vars.CYBERMED_DIGEST_BACKFILL_LOOKBACK_HOURS || '' }}
      CYBERMED_DIGEST_BACKFILL_RUN_DATE: ${{ vars.CYBERMED_DIGEST_BACKFILL_RUN_DATE || '' }}
      CYBERMED_DIGEST_BACKFILL_OVERWRITE_EMPTY_ONLY: ${{ vars.CYBERMED_DIGEST_BACKFILL_OVERWRITE_EMPTY_ONLY || '1' }}
      CYBERMED_DIGEST_BACKFILL_MAX_PUBMED: ${{ vars.CYBERMED_DIGEST_BACKFILL_MAX_PUBMED || '25' }}
      CYBERMED_DIGEST_BACKFILL_MAX_FOAMED: ${{ vars.CYBERMED_DIGEST_BACKFILL_MAX_FOAMED || '15' }}
      CYBERMED_WEEKLY_QA_FIXTURE_MODE: ${{ vars.CYBERMED_WEEKLY_QA_FIXTURE_MODE || '0' }}
      CYBERMED_WEEKLY_QA_FIXTURE_PATH: ${{ vars.CYBERMED_WEEKLY_QA_FIXTURE_PATH || 'tests/fixtures/cybermed_weekly_digest_store_nonempty.json' }}
      CYBERLURCH_CHANNELS_FILE_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.cyberlurch_channels_file || '') || '' }}
      CYBERLURCH_DAILY_SELECTED_ITEMS_MAX: ${{ vars.CYBERLURCH_DAILY_SELECTED_ITEMS_MAX || '12' }}
      CYBERLURCH_DAILY_DEEP_DIVES_MAX: ${{ vars.CYBERLURCH_DAILY_DEEP_DIVES_MAX || '2' }}
      MANAGED_TRANSCRIPT_PROVIDER_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.managed_transcript_provider || 'default') || 'default' }}

    steps:
      - name: Capture observed job start
        run: echo "NEWSAGENT_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bash tools/install_dependencies.sh runtime

      - name: Compute frozen cyberlurch run plan
        id: compute_plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERSIST_MONTHLY_ROLLUP_REQUEST: ${{ inputs.persist_monthly_rollup && 'true' || 'false' }}
          ROLLUP_MONTH_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.rollup_month_override || '' }}
          YEAR_IN_REVIEW_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.year_in_review_year || '' }}
        run: |
          set -euo pipefail
          manual_monthly_state_write=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$PERSIST_MONTHLY_ROLLUP_REQUEST" = "true" ]; then
            if [ "$WHICH_REPORT" != "cyberlurch" ] \
              || [ "$REPORT_MODE" != "monthly" ] \
              || [ "$EMAIL_MODE" != "none" ] \
              || ! [[ "${ROLLUP_MONTH_OVERRIDE:-}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
              echo "ERROR: persist_monthly_rollup requires workflow_dispatch, Cyberlurch Monthly, email_mode=none, and a valid YYYY-MM override." >&2
              exit 1
            fi
            manual_monthly_state_write=true
            echo "maintenance_month=$ROLLUP_MONTH_OVERRIDE" >> "$GITHUB_OUTPUT"
          fi
          echo "manual_monthly_state_write=$manual_monthly_state_write" >> "$GITHUB_OUTPUT"
          python -m src.newsagent2.edition_plan --report-key cyberlurch

      - name: "NewsAgent2 recovery v1 / cyberlurch / ${{ steps.compute_plan.outputs.manual_monthly_state_write == 'true' && format('maintenance:{0}', steps.compute_plan.outputs.maintenance_month) || env.EMAIL_MODE }}"
        run: |
          case "$EMAIL_MODE" in
            none|test|real) echo "Recovery mode validated." ;;
            *) exit 1 ;;
          esac

      - name: Validate Cyberlurch SMTP configuration
        if: steps.compute_plan.outputs.run_skip != 'true'
        run: |
          set -euo pipefail
          if [ "${SEND_EMAIL:-0}" != "1" ]; then
            echo "Email sending is disabled; skipping Cyberlurch SMTP validation."
            exit 0
          fi

          missing=()
          for variable in EMAIL_FROM SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS; do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Cyberlurch SMTP configuration is incomplete; missing runtime variables: ${missing[*]}" >&2
            exit 1
          fi
          echo "Cyberlurch SMTP configuration is present."

      - name: Set up Deno for yt-dlp JS runtime
        if: steps.compute_plan.outputs.run_skip != 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Deno runtime
        if: steps.compute_plan.outputs.run_skip != 'true'
        run: deno --version

      - name: Prepare output directory
        if: steps.compute_plan.outputs.run_skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p out

      - name: Recover prior cyberlurch receipts before any sender
        if: steps.compute_plan.outputs.run_skip != 'true' && (github.event_name == 'schedule' || env.EMAIL_MODE == 'real')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.newsagent2.workflow_delivery recover --report-key cyberlurch --workflow newsagent.yml

      - name: Run reports
        if: steps.compute_plan.outputs.run_skip != 'true'
        env:
          RUN_MODES: ${{ steps.compute_plan.outputs.run_modes }}
          RUN_WHICH_REPORT: ${{ steps.compute_plan.outputs.run_which_report }}
          LOOKBACK_HOURS_OVERRIDE: ${{ env.LOOKBACK_HOURS_OVERRIDE }}
          REPORT_DIR: ${{ env.REPORT_DIR }}
          RUN_LOG_PATH: out/run.log
          EMAIL_MODE: ${{ env.EMAIL_MODE }}
          SEND_EMAIL: ${{ env.SEND_EMAIL }}
          CYBERLURCH_MONTHLY_MANUAL_STATE_WRITE: ${{ steps.compute_plan.outputs.manual_monthly_state_write == 'true' && '1' || '0' }}
          CYBERLURCH_CHANNELS_FILE_OVERRIDE: ${{ env.CYBERLURCH_CHANNELS_FILE_OVERRIDE }}
          YOUTUBE_TRANSCRIPT_PROVIDER: ${{ env.MANAGED_TRANSCRIPT_PROVIDER_OVERRIDE != 'default' && env.MANAGED_TRANSCRIPT_PROVIDER_OVERRIDE || (vars.YOUTUBE_TRANSCRIPT_PROVIDER || 'none') }}
          YOUTUBE_TRANSCRIPT_API_KEY: ${{ secrets.YOUTUBE_TRANSCRIPT_API_KEY || '' }}
          YOUTUBE_TRANSCRIPT_API_BASE_URL: ${{ vars.YOUTUBE_TRANSCRIPT_API_BASE_URL || '' }}
          MANAGED_TRANSCRIPT_MAX_VIDEOS_PER_RUN: ${{ vars.MANAGED_TRANSCRIPT_MAX_VIDEOS_PER_RUN || '25' }}
          MANAGED_TRANSCRIPT_MIN_CHARS: ${{ vars.MANAGED_TRANSCRIPT_MIN_CHARS || '300' }}
          MANAGED_TRANSCRIPT_LANGS: ${{ vars.MANAGED_TRANSCRIPT_LANGS || 'de,en,sv' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || '' }}
          YOUTUBE_API_METADATA: ${{ vars.YOUTUBE_API_METADATA || '1' }}
          YOUTUBE_CONTENT_CACHE_TEXT: ${{ vars.YOUTUBE_CONTENT_CACHE_TEXT || '0' }}
          CYBERLURCH_MANAGED_TRANSCRIPTS_FOR_ROLLUPS: ${{ vars.CYBERLURCH_MANAGED_TRANSCRIPTS_FOR_ROLLUPS || '0' }}
          CYBERLURCH_DEEPDIVE_MAX_TRANSCRIPT_CHARS: ${{ vars.CYBERLURCH_DEEPDIVE_MAX_TRANSCRIPT_CHARS || '18000' }}
          CYBERLURCH_DETAIL_ITEMS_PER_DAY: ${{ vars.CYBERLURCH_DETAIL_ITEMS_PER_DAY || '10' }}
          CYBERLURCH_DETAIL_ITEMS_PER_CHANNEL_MAX: ${{ vars.CYBERLURCH_DETAIL_ITEMS_PER_CHANNEL_MAX || '1' }}
          CYBERLURCH_DEEPDIVE_MIN_TEXT_CHARS: ${{ vars.CYBERLURCH_DEEPDIVE_MIN_TEXT_CHARS || '2500' }}
          CYBERLURCH_DIRECT_TRANSCRIPT_MAX_CHARS: ${{ vars.CYBERLURCH_DIRECT_TRANSCRIPT_MAX_CHARS || '80000' }}
          CYBERLURCH_TRANSCRIPT_CHUNKING_MIN_CHARS: ${{ vars.CYBERLURCH_TRANSCRIPT_CHUNKING_MIN_CHARS || '80000' }}

          # Recipients are passed as Secrets (JSON) to avoid leaking addresses in logs.
          RECIPIENTS_JSON_CYBERLURCH: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERLURCH || '' }}
          RECIPIENTS_JSON_CYBERLURCH_DAILY: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERLURCH_DAILY || '' }}
          RECIPIENTS_JSON_CYBERLURCH_WEEKLY: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERLURCH_WEEKLY || '' }}
          RECIPIENTS_JSON_CYBERLURCH_MONTHLY: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERLURCH_MONTHLY || '' }}
          RECIPIENTS_JSON_CYBERMED: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERMED || '' }}
          RECIPIENTS_JSON_CYBERMED_DAILY: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERMED_DAILY || '' }}
          RECIPIENTS_JSON_CYBERMED_WEEKLY: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERMED_WEEKLY || '' }}
          RECIPIENTS_JSON_CYBERMED_MONTHLY: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON_CYBERMED_MONTHLY || '' }}
          RECIPIENTS_CONFIG_JSON: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_CONFIG_JSON || '' }}
          RECIPIENTS_JSON: ${{ (github.event_name != 'workflow_dispatch' || (github.event.inputs.email_mode || 'none') == 'real') && secrets.RECIPIENTS_JSON || '' }}
          TEST_RECIPIENTS_CONFIG_JSON: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.email_mode || 'none') == 'test' && secrets.TEST_RECIPIENTS_CONFIG_JSON || '' }}
          YEAR_IN_REVIEW_YEAR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.year_in_review_year || '' }}
        run: |
          set -euo pipefail
          LOG_PATH="${RUN_LOG_PATH:-out/run.log}"
          mkdir -p "$(dirname "$LOG_PATH")"
          : > "$LOG_PATH"
          exec > >(tee -a "$LOG_PATH") 2>&1

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${EMAIL_MODE:-none}" in
              none)
                export SEND_EMAIL=0
                unset RECIPIENTS_CONFIG_JSON RECIPIENTS_JSON
                unset RECIPIENTS_JSON_CYBERLURCH RECIPIENTS_JSON_CYBERLURCH_DAILY RECIPIENTS_JSON_CYBERLURCH_WEEKLY RECIPIENTS_JSON_CYBERLURCH_MONTHLY
                unset RECIPIENTS_JSON_CYBERMED RECIPIENTS_JSON_CYBERMED_DAILY RECIPIENTS_JSON_CYBERMED_WEEKLY RECIPIENTS_JSON_CYBERMED_MONTHLY
                ;;
              test)
                export SEND_EMAIL=1
                unset RECIPIENTS_JSON
                unset RECIPIENTS_JSON_CYBERLURCH RECIPIENTS_JSON_CYBERLURCH_DAILY RECIPIENTS_JSON_CYBERLURCH_WEEKLY RECIPIENTS_JSON_CYBERLURCH_MONTHLY
                unset RECIPIENTS_JSON_CYBERMED RECIPIENTS_JSON_CYBERMED_DAILY RECIPIENTS_JSON_CYBERMED_WEEKLY RECIPIENTS_JSON_CYBERMED_MONTHLY
                export RECIPIENTS_CONFIG_JSON="${TEST_RECIPIENTS_CONFIG_JSON:-}"
                ;;
              real)
                export SEND_EMAIL="${SEND_EMAIL:-1}"
                ;;
              *)
                echo "ERROR: unsupported email_mode"
                exit 1
                ;;
            esac
            echo "Manual email mode: ${EMAIL_MODE:-none}"
          fi

          for mode in $RUN_MODES; do
            echo "--- Running cadence: $mode (which_report=$RUN_WHICH_REPORT) ---"
            export REPORT_MODE="$mode"

            if [ "$RUN_WHICH_REPORT" = "both" ] || [ "$RUN_WHICH_REPORT" = "cyberlurch" ]; then
              CHFILE="data/channels.json"
              if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${CYBERLURCH_CHANNELS_FILE_OVERRIDE:-}" ]; then
                case "${CYBERLURCH_CHANNELS_FILE_OVERRIDE}" in
                  data/*.json) ;;
                  *) echo "ERROR: invalid cyberlurch_channels_file: must start with data/ and end with .json"; exit 1 ;;
                esac
                case "${CYBERLURCH_CHANNELS_FILE_OVERRIDE}" in
                  *..*) echo "ERROR: invalid cyberlurch_channels_file: must not contain .."; exit 1 ;;
                esac
                if [ ! -f "${CYBERLURCH_CHANNELS_FILE_OVERRIDE}" ]; then
                  echo "ERROR: invalid cyberlurch_channels_file: file does not exist"
                  exit 1
                fi
                CHFILE="${CYBERLURCH_CHANNELS_FILE_OVERRIDE}"
              fi

              REPORT_KEY=cyberlurch \
              REPORT_TITLE="The Cyberlurch Report" \
              REPORT_SUBJECT="The Cyberlurch Report" \
              REPORT_LANGUAGE=en \
              REPORT_PROFILE=general \
              SEND_EMPTY_REPORT_EMAIL="1" \
              python -m src.newsagent2.main --channels "$CHFILE" --hours 24
            fi

          done

      - name: Verify each planned cyberlurch delivery result
        if: always() && steps.compute_plan.outputs.run_skip != 'true'
        env:
          RUN_MODES: ${{ steps.compute_plan.outputs.run_modes }}
        run: |
          set -euo pipefail
          python -m src.newsagent2.workflow_delivery verify --report-key cyberlurch --modes $RUN_MODES

      - name: Preserve failure before plan creation
        if: always()
        run: |
          if [ ! -f "$NEWSAGENT_PLAN_PATH" ]; then
            python -c 'from src.newsagent2.run_timing import write_plan_failure; write_plan_failure("cyberlurch", "workflow_failed_before_plan")'
          fi

      - name: Upload cyberlurch report and recovery artifacts
        if: always() && steps.compute_plan.outputs.run_skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cyberlurch-reports-${{ github.run_id }}
          path: |
            out/*.md
            out/*diagnostics*.json
            out/*metadata*.json
            out/*metadata*.md
            out/*delivery_result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and publish validated cyberlurch state
        if: success() && steps.compute_plan.outputs.run_skip != 'true' && (github.event_name == 'schedule' || env.EMAIL_MODE == 'real' || steps.compute_plan.outputs.manual_monthly_state_write == 'true')
        run: |
          set -euo pipefail
          git config user.name "newsagent-bot"
          git config user.email "newsagent-bot@users.noreply.github.com"
          if [ "${{ steps.compute_plan.outputs.manual_monthly_state_write }}" = "true" ]; then
            unexpected="$(git status --porcelain -- state ':!state/rollups.json')"
            if [ -n "$unexpected" ]; then
              echo "ERROR: backfill modified state outside the approved rollup"
              exit 1
            fi
            python -m src.newsagent2.workflow_delivery publish --backfill-apply --paths state/rollups.json
          else
            python -m src.newsagent2.workflow_delivery publish --paths state/processed_items.json state/rollups.json state/delivery_journal.json state/cyberlurch_digests.json state/youtube_content_cache.json state/youtube_channel_ids.json state/youtube_transcript_attempts.json
          fi

      - name: Upload cyberlurch delivery recovery
        if: always() && steps.compute_plan.outputs.run_skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cyberlurch-delivery-recovery-${{ github.run_id }}
          path: out/recovery/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload cyberlurch plan and observed timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cyberlurch-run-metadata-${{ github.run_id }}
          path: |
            out/*plan_metadata.json
            out/*plan_failure_metadata.json
            out/*timing_metadata.json
          if-no-files-found: warn
          retention-days: 30
